[project]
name = "binder-scorer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "lightgbm>=4.5",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["pc_contracts", "data", "scorer"]
