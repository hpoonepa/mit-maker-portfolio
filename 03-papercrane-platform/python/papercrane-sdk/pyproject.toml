[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "papercrane-sdk"
version = "0.1.0"
description = "Paper Crane tool-adapter SDK for Python GPU container tools (BindCraft, RFdiffusion, etc.)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Paper Crane" }
]
keywords = ["protein-design", "binder-design", "papercrane", "bindcraft", "rfdiffusion"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://papercrane.bio"

[tool.hatch.build.targets.wheel]
packages = ["src/papercrane_sdk"]

[tool.hatch.build.targets.sdist]
include = [
    "src/papercrane_sdk",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
